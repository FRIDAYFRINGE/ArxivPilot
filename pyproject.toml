[project]
name = "paper-intel"
version = "0.1.0"
description = "Agentic RAG system for ML/AI arxiv papers with hybrid retrieval and hallucination eval"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "qdrant-client>=1.10.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24.0",
    "arxiv>=2.1.0",
    "networkx>=3.3",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic-settings>=2.3.0",
    "numpy>=1.26.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
paper-intel = "paper_intel.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
